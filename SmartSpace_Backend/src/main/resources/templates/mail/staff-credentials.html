<!DOCTYPE html>
<!--
  Email: thông tin tài khoản nhân viên mới.
  - Layout bằng <table> + CSS inline để tương thích Gmail / Outlook / Apple Mail.
  - Màu theo app_architecture/design/design.md (Light mặc định, Dark qua prefers-color-scheme).
  - Mọi text lấy từ i18n (mail.staff.credentials.*); dữ liệu người dùng render bằng th:text (auto-escape).
  Biến: fullName, email, password, positionName?, logoUrl?, staffAppUrl?, supportEmail?, year, lang
-->
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title th:text="#{mail.staff.credentials.subject}">SmartSpace</title>
  <style>
    body { margin: 0; padding: 0; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
    a { text-decoration: none; }

    @media only screen and (max-width: 620px) {
      .container { width: 100% !important; }
      .px { padding-left: 20px !important; padding-right: 20px !important; }
      .password { font-size: 18px !important; letter-spacing: 1px !important; }
      .btn a { display: block !important; }
    }

    @media (prefers-color-scheme: dark) {
      .bg-page { background-color: #0F1715 !important; }
      .bg-surface { background-color: #17211E !important; }
      .bg-variant { background-color: #1D2A26 !important; }
      .bg-header { background-color: #004D40 !important; }
      .text-primary { color: #E7EFEC !important; }
      .text-secondary { color: #B4C2BE !important; }
      .text-muted { color: #899A95 !important; }
      .text-brand { color: #4DB6AC !important; }
      .border { border-color: #30403B !important; }
      .divider { border-top-color: #273631 !important; }
      .warning-bar { border-left-color: #FFCA28 !important; }
    }
  </style>
</head>
<body class="bg-page" style="margin:0; padding:0; background-color:#F5F8F7;">

  <!-- Preheader: dòng xem trước trong hộp thư (ẩn khi mở mail) -->
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:#F5F8F7; opacity:0;"
       th:text="#{mail.staff.credentials.preheader}">Preheader</div>

  <table role="presentation" class="bg-page" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F5F8F7;">
    <tr>
      <td align="center" style="padding:32px 12px;">

        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0"
               style="width:600px; max-width:600px;">

          <!-- ===== Header ===== -->
          <tr>
            <td class="bg-header px" align="left"
                style="background-color:#00796B; border-radius:16px 16px 0 0; padding:24px 40px;">
              <img th:if="${logoUrl}" th:src="${logoUrl}" src="" alt="SmartSpace" height="36"
                   style="display:block; height:36px; width:auto;">
              <span th:unless="${logoUrl}"
                    style="font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:22px; font-weight:700; letter-spacing:0.3px; color:#FFFFFF;">SmartSpace</span>
            </td>
          </tr>

          <!-- ===== Body ===== -->
          <tr>
            <td class="bg-surface px border"
                style="background-color:#FFFFFF; padding:36px 40px 8px 40px; border-left:1px solid #D8E2DF; border-right:1px solid #D8E2DF; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

              <h1 class="text-primary" th:text="#{mail.staff.credentials.title}"
                  style="margin:0 0 20px 0; font-size:24px; line-height:32px; font-weight:700; color:#17201E;">Welcome</h1>

              <p class="text-primary" th:text="#{mail.staff.credentials.greeting(${fullName})}"
                 style="margin:0 0 12px 0; font-size:16px; line-height:24px; font-weight:600; color:#17201E;">Hello,</p>

              <p class="text-secondary" th:text="#{mail.staff.credentials.intro}"
                 style="margin:0 0 24px 0; font-size:15px; line-height:24px; color:#52615D;">Intro</p>

              <!-- Credentials box -->
              <table role="presentation" class="bg-variant border" width="100%" cellpadding="0" cellspacing="0" border="0"
                     style="background-color:#EEF4F2; border:1px solid #D8E2DF; border-radius:12px;">
                <tr>
                  <td style="padding:20px 24px;">
                    <p class="text-brand" th:text="#{mail.staff.credentials.box_title}"
                       style="margin:0 0 16px 0; font-size:13px; line-height:18px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; color:#00796B;">Sign-in</p>

                    <p class="text-muted" th:text="#{mail.staff.credentials.label.email}"
                       style="margin:0 0 4px 0; font-size:13px; line-height:18px; color:#7A8783;">Email</p>
                    <p class="text-primary" style="margin:0 0 16px 0; font-size:16px; line-height:24px; font-weight:600; color:#17201E; word-break:break-all;">
                      <span th:text="${email}">staff@example.com</span>
                    </p>

                    <p class="text-muted" th:text="#{mail.staff.credentials.label.password}"
                       style="margin:0 0 6px 0; font-size:13px; line-height:18px; color:#7A8783;">Password</p>
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td class="bg-surface border password" th:text="${password}"
                            style="background-color:#FFFFFF; border:1px dashed #B8C9C4; border-radius:8px; padding:10px 16px; font-family:Consolas,'SFMono-Regular',Menlo,'Courier New',monospace; font-size:20px; line-height:28px; font-weight:700; letter-spacing:2px; color:#17201E;">Ab3#xK9pQ2</td>
                      </tr>
                    </table>

                    <th:block th:if="${positionName}">
                      <p class="text-muted" th:text="#{mail.staff.credentials.label.position}"
                         style="margin:16px 0 4px 0; font-size:13px; line-height:18px; color:#7A8783;">Position</p>
                      <p class="text-primary" th:text="${positionName}"
                         style="margin:0; font-size:16px; line-height:24px; font-weight:600; color:#17201E;">Technician</p>
                    </th:block>
                  </td>
                </tr>
              </table>

              <!-- CTA: chỉ hiện khi đã cấu hình link tải app -->
              <table th:if="${staffAppUrl}" role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 4px 0;">
                <tr>
                  <td class="btn" align="center" bgcolor="#00796B" style="border-radius:10px; background-color:#00796B;">
                    <a th:href="${staffAppUrl}" href="#" target="_blank" th:text="#{mail.staff.credentials.cta}"
                       style="display:inline-block; padding:14px 28px; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:20px; font-weight:600; color:#FFFFFF; text-decoration:none; border-radius:10px;">Get the app</a>
                  </td>
                </tr>
              </table>

              <!-- Steps -->
              <h2 class="text-primary" th:text="#{mail.staff.credentials.steps_title}"
                  style="margin:32px 0 16px 0; font-size:17px; line-height:24px; font-weight:700; color:#17201E;">Steps</h2>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr th:each="stepKey, stat : ${ {'mail.staff.credentials.step1','mail.staff.credentials.step2','mail.staff.credentials.step3'} }">
                  <td width="36" valign="top" style="padding:0 12px 14px 0;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="center" valign="middle" class="text-brand border" th:text="${stat.count}"
                            style="width:26px; height:26px; border:1.5px solid #00796B; border-radius:13px; font-size:13px; line-height:26px; font-weight:700; color:#00796B;">1</td>
                      </tr>
                    </table>
                  </td>
                  <td valign="top" class="text-secondary" th:text="#{__${stepKey}__}"
                      style="padding:3px 0 14px 0; font-size:15px; line-height:22px; color:#52615D;">Step</td>
                </tr>
              </table>

              <!-- Security notice -->
              <table role="presentation" class="bg-variant warning-bar" width="100%" cellpadding="0" cellspacing="0" border="0"
                     style="margin:12px 0 28px 0; background-color:#EEF4F2; border-left:4px solid #F9A825; border-radius:0 8px 8px 0;">
                <tr>
                  <td style="padding:14px 18px;">
                    <p class="text-primary" th:text="#{mail.staff.credentials.security_title}"
                       style="margin:0 0 4px 0; font-size:14px; line-height:20px; font-weight:700; color:#17201E;">Security</p>
                    <p class="text-secondary" th:text="#{mail.staff.credentials.security_body}"
                       style="margin:0; font-size:14px; line-height:21px; color:#52615D;">Notice</p>
                  </td>
                </tr>
              </table>

              <p class="text-muted" th:text="#{mail.staff.credentials.not_you}"
                 style="margin:0 0 28px 0; font-size:13px; line-height:20px; color:#7A8783;">Not you</p>
            </td>
          </tr>

          <!-- ===== Footer ===== -->
          <tr>
            <td class="bg-surface px border"
                style="background-color:#FFFFFF; border:1px solid #D8E2DF; border-top:0; border-radius:0 0 16px 16px; padding:0 40px 28px 40px; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td class="divider" style="border-top:1px solid #E5ECEA; padding-top:20px;">
                    <p th:if="${supportEmail}" class="text-muted"
                       style="margin:0 0 8px 0; font-size:13px; line-height:20px; color:#7A8783;">
                      <span th:text="#{mail.staff.credentials.support}">Need help? Contact</span>
                      <a class="text-brand" th:href="'mailto:' + ${supportEmail}" th:text="${supportEmail}" href="#"
                         style="color:#00796B; font-weight:600; text-decoration:none;">support@example.com</a>
                    </p>
                    <p class="text-muted" th:text="#{mail.staff.credentials.footer_auto}"
                       style="margin:0 0 4px 0; font-size:12px; line-height:18px; color:#7A8783;">Automated</p>
                    <p class="text-muted" th:text="#{mail.staff.credentials.footer_copyright(${year})}"
                       style="margin:0; font-size:12px; line-height:18px; color:#7A8783;">© SmartSpace</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
