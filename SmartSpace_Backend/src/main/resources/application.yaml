server:
  port: 8989

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: SmartSpace

  datasource:
    url: "jdbc:mysql://localhost:3306/smart_space?createDatabaseIfNotExist=true"
    driverClassName: "com.mysql.cj.jdbc.Driver"
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        type:
          json_format_mapper: com.vn.smart_space.configuration.CustomHibernateJsonFormatter

  # Redis Config
  data:
    redis:
      host: localhost
      port: 6379

  # Mail Config (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Timeout (ms) — mặc định JavaMail chờ vô hạn, làm request treo khi SMTP chậm.
          # Tổng tối đa ~25s phải < receiveTimeout của request tạo staff ở app admin (30s).
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

# JWT Config
jwt:
  signerKey: ${JWT_SIGNER_KEY}

# Google OAuth2
google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}

# Cloudinary Config
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  folder: smartspace

firebase:
  service-account-path: classpath:smart-space-36687-firebase-adminsdk-fbsvc-5c08d9199a.json

# App Mail Config (template email: templates/mail/*)
# Tất cả đều tuỳ chọn: để trống -> logo dạng chữ, ẩn nút tải app, ẩn dòng hỗ trợ.
app:
  mail:
    from-name: ${MAIL_FROM_NAME:SmartSpace}
    logo-url: ${MAIL_LOGO_URL:}
    staff-app-url: ${MAIL_STAFF_APP_URL:}
    support-email: ${MAIL_SUPPORT_EMAIL:}
