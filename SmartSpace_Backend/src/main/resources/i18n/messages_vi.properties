mail.staff.credentials.body=Xin chào {0},\n\nTài khoản nhân viên SmartSpace của bạn đã được khởi tạo.\n\nTHÔNG TIN ĐĂNG NHẬP\n- Email đăng nhập: {1}\n- Mật khẩu tạm thời: {2}\n\nBẮT ĐẦU TRONG 3 BƯỚC\n1. Mở ứng dụng SmartSpace Staff và đăng nhập bằng email ở trên.\n2. Đổi mật khẩu tạm thời tại Cài đặt → Đổi mật khẩu.\n3. Cho phép nhận thông báo để không bỏ lỡ công việc được phân công.\n\nLƯU Ý BẢO MẬT: Không chia sẻ mật khẩu cho bất kỳ ai. SmartSpace không bao giờ yêu cầu bạn cung cấp mật khẩu qua điện thoại, tin nhắn hay email.\n\nĐây là email tự động, vui lòng không trả lời trực tiếp.\nSmartSpace
