          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p${{ format('ci-{0}', github.run_id) }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies & Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Resolve CI Test Credentials
        env:
          SEC_PW_ADMIN_EMAIL: ${{ secrets.PW_ADMIN_EMAIL }}
          SEC_PW_ADMIN_PASSWORD: ${{ secrets.PW_ADMIN_PASSWORD }}
          SEC_PW_STAFF_EMAIL: ${{ secrets.PW_STAFF_EMAIL }}
          SEC_PW_STAFF_PASSWORD: ${{ secrets.PW_STAFF_PASSWORD }}
          SEC_PW_CLIENT_EMAIL: ${{ secrets.PW_CLIENT_EMAIL }}
          SEC_PW_CLIENT_PASSWORD: ${{ secrets.PW_CLIENT_PASSWORD }}
        run: |
          node -e '
            const fs = require("node:fs");
            const dataInit = fs.readFileSync("SmartSpace_Backend/src/main/java/com/vn/smart_space/configuration/DataInitializer.java", "utf8");
            for (const m of dataInit.matchAll(/@Value\("\$\{(PW_[A-Z_]+):([^}]+)\}"\)/g)) {
              const key = m[1];
              const val = (process.env["SEC_" + key] || "").trim() || m[2].trim();
              if (key.includes("PASSWORD")) console.log("::add-mask::" + val);
              fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${val}\n`);
            }
          '

      - name: Prepare Backend secrets & Flutter dependencies
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_JSON" ]; then
            echo "::error::Thiếu GitHub Secret FIREBASE_SERVICE_ACCOUNT_JSON để khởi chạy Spring Boot Backend."
            exit 1
          fi
          printf '%s' "$FIREBASE_JSON" > SmartSpace_Backend/src/main/resources/smart-space-36687-firebase-adminsdk-fbsvc-5c08d9199a.json
          [ -f smartspace_client/.env ] || printf 'GOOGLE_CLIENT_ID=\nMAPBOX_ACCESS_TOKEN=\n' > smartspace_client/.env
          (cd mobile_shared && flutter pub get)
          cd smartspace_client && flutter pub get

      - name: Run Shared + Client Native + Playwright Tests
        env:
          DB_PASSWORD: ${{ env.PW_RUN_DB_PASSWORD }}
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SIGNER_KEY: ${{ secrets.JWT_SIGNER_KEY || format('ci-ephemeral-hs512-key-{0}-{1}-smartspace-automation-testing-pad', github.run_id, github.run_number) }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME || 'ci-placeholder@example.invalid' }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD || 'ci-placeholder' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || 'ci-placeholder' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || 'ci-placeholder' }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI || 'http://localhost:8989/auth/google/callback' }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || 'ci-placeholder' }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY || 'ci-placeholder' }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET || 'ci-placeholder' }}
          PW_REBUILD_BACKEND: 'true'
          PW_REBUILD_WEB: 'true'
        run: |
          mkdir -p native-results/client
          SHARED_EXIT=0
          CLIENT_NATIVE_EXIT=0
          PW_EXIT=0

          set +e
          (cd mobile_shared && flutter test --file-reporter="json:../native-results/client/native-shared.json")
          SHARED_EXIT=$?
          (cd smartspace_client && flutter test --file-reporter="json:../native-results/client/native-client.json")
          CLIENT_NATIVE_EXIT=$?
          npm run client:test
          PW_EXIT=$?
          set -e

          echo "Client stage exit codes: SHARED=$SHARED_EXIT NATIVE=$CLIENT_NATIVE_EXIT PW=$PW_EXIT"
          if [ "$SHARED_EXIT" -ne 0 ] || [ "$CLIENT_NATIVE_EXIT" -ne 0 ] || [ "$PW_EXIT" -ne 0 ]; then
            exit 1
          fi

      - name: Upload Client Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-playwright-report
          path: |
            playwright-report/client/
            test-results/client/
            native-results/client/
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: Final Summary
    needs:
      - backend-test
      - admin-test
      - staff-test
      - client-test
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.merged == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download Backend Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-playwright-report
          path: artifacts/backend

      - name: Download Admin Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: admin-playwright-report
          path: artifacts/admin

      - name: Download Staff Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: staff-playwright-report
          path: artifacts/staff

      - name: Download Client Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: client-playwright-report
          path: artifacts/client

      - name: Generate Final Summary Table
        env:
          RES_BACKEND: ${{ needs.backend-test.result }}
          RES_ADMIN: ${{ needs.admin-test.result }}
          RES_STAFF: ${{ needs.staff-test.result }}
          RES_CLIENT: ${{ needs.client-test.result }}
        run: node playwright/scripts/summarize-ci.mjs artifacts
