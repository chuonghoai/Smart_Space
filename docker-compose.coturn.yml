services:
  coturn:
    image: coturn/coturn:4.6.2
    container_name: smartspace-coturn
    restart: unless-stopped
    network_mode: host
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--tls-listening-port=5349"
      - "--min-port=49152"
      - "--max-port=49252"
      - "--realm=${COTURN_REALM:-smartspace.local}"
      - "--use-auth-secret"
      - "--static-auth-secret=${WEBRTC_TURN_SHARED_SECRET:-replace_with_shared_secret}"
      - "--fingerprint"
      - "--no-multicast-peers"
      - "--no-cli"
    # Note: In production behind NAT/cloud VM, also pass:
    #   --external-ip=<PUBLIC_IP>/<PRIVATE_IP>
    # and mount TLS certificates (--cert / --pkey) for turns:5349.
